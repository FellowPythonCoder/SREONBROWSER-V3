name: Package desktop apps

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            build: dist:linux
            pattern: release/*.AppImage
          - platform: windows
            runner: windows-2022
            build: dist:win
            pattern: release/*.exe
          - platform: macos
            runner: macos-15
            build: dist:mac
            pattern: release/*.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build native installer
        run: npm run ${{ matrix.build }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_LINK || matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sreon-browser-${{ matrix.platform }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Save installers in draft release
    needs: package
    # Never run a write-token job for a forked PR. No PR source is checked out
    # or executed in this job; it only handles artifacts from the build matrix.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'FellowPythonCoder'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sreon-browser-*
          path: installers
          merge-multiple: true
      - name: Create private draft with installer assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release create "v0.1.0-preview-${GITHUB_RUN_ID}" installers/*.AppImage installers/*.exe installers/*.dmg \
            --target "$HEAD_SHA" --draft --prerelease \
            --title "SREON Browser 0.1.0 preview (unsigned)" \
            --notes "Preview installers built from PR #${{ github.event.pull_request.number }}. Windows/macOS binaries are unsigned and macOS is not notarized. Test and sign before public publication."
