<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https: http:; object-src 'none'; base-uri 'none'">
<title>SREON Browser</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
  <header class="chrome">
    <div class="topbar"><div class="identity"><img src="../assets/icon.png" alt="" width="23" height="23"><span>SREON</span></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Browser tabs"></div>
      <button class="new-tab" id="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
      <span class="topbar-spacer"></span><span class="edition">BROWSER V3</span>
    </div>
    <div class="toolbar">
      <div class="nav-actions">
        <button id="back" class="icon-button" title="Back (Alt+Left)" aria-label="Back" disabled><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h13"/></svg></button>
        <button id="forward" class="icon-button" title="Forward (Alt+Right)" aria-label="Forward" disabled><svg viewBox="0 0 24 24"><path d="m10 5 7 7-7 7M17 12H4"/></svg></button>
        <button id="reload" class="icon-button" title="Reload (Ctrl+R)" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.4 6M20 4v7h-7"/></svg></button>
        <button id="home" class="icon-button" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="m3 11 9-7 9 7M5 10v10h14V10M9 20v-7h6v7"/></svg></button>
      </div>
      <form id="address-form" class="address-form" autocomplete="off"><span class="address-symbol" id="address-symbol">✦</span><input id="address" aria-label="Search or enter address" type="text" placeholder="Search or enter a website" spellcheck="false" autocomplete="off"><span id="loading-indicator" class="loading-indicator" aria-hidden="true"></span></form>
      <div class="toolbar-right"><span class="toolbar-label">A better way to browse</span><span class="status-dot" title="Ready"></span></div>
    </div>
  </header>
  <main class="content-area"><div class="views" id="views"></div>
    <section class="home-page" id="home-page" aria-label="New tab">
      <div class="home-glow"></div><div class="home-inner">
        <div class="home-kicker"><span class="kicker-line"></span> YOUR WINDOW TO THE WEB</div>
        <div class="home-brand"><div class="home-logo"><img src="../assets/icon.png" width="72" height="72" alt=""></div><div class="home-wordmark">SREON<span>BROWSER</span></div></div>
        <h1>Where will you go <em>today?</em></h1><p class="home-subtitle">A fresh start for every new discovery.</p>
        <form id="home-form" class="home-search" autocomplete="off"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="home-input" aria-label="Search the web or enter a URL" placeholder="Search anything or type a URL..." spellcheck="false"><button type="submit">Explore <span>↗</span></button></form>
        <div class="quick-label">QUICK ACCESS <span></span></div>
        <div class="quick-links"><button data-url="https://www.google.com" class="quick-link"><span class="quick-icon google">G</span><span>Google</span><span class="quick-arrow">↗</span></button><button data-url="https://www.wikipedia.org" class="quick-link"><span class="quick-icon wiki">W</span><span>Wikipedia</span><span class="quick-arrow">↗</span></button><button data-url="https://github.com" class="quick-link"><span class="quick-icon github">⌘</span><span>GitHub</span><span class="quick-arrow">↗</span></button><button data-url="https://www.youtube.com" class="quick-link"><span class="quick-icon youtube">▶</span><span>YouTube</span><span class="quick-arrow">↗</span></button></div>
      </div><div class="home-footer"><span>✦</span> BUILT FOR THE CURIOUS <span class="footer-right">SREON BROWSER · V3</span></div>
    </section>
  </main>
</div>
<script src="renderer.js"></script>
</body></html>
