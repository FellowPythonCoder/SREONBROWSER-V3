<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark">
<style>
html,body{margin:0;height:100%;background:#0a0a10;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
.s{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
svg{width:112px;height:112px;overflow:visible}
.sq{fill:#0c0c14;stroke:rgba(255,255,255,.09);stroke-width:1.5;opacity:0;transform-origin:64px 64px;animation:sq .5s cubic-bezier(.2,.8,.2,1) .05s forwards}
.a{fill:none;stroke-width:10;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.a1{stroke:#f3f3f8;animation:dr .62s cubic-bezier(.65,0,.25,1) .42s forwards}
.a2{stroke:url(#g);animation:dr .62s cubic-bezier(.65,0,.25,1) .86s forwards}
.mk{animation:pop .5s cubic-bezier(.2,.8,.2,1) 1.4s}
.w{font-size:30px;font-weight:600;letter-spacing:.34em;color:#f3f3f8;opacity:0;padding-left:.34em;animation:up .6s cubic-bezier(.2,.8,.2,1) 1.0s forwards}
.p{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6c6c80;opacity:0;margin-top:-14px;display:flex;align-items:center;gap:7px;animation:up .6s ease 1.25s forwards}
.p svg{width:11px;height:11px}
.bar{position:absolute;left:50%;bottom:34px;width:120px;height:2px;margin-left:-60px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#8b7cff;transform:translateX(-100%);animation:ld 1.7s cubic-bezier(.4,0,.2,1) .1s forwards}
body.out .s,body.out .bar{opacity:0;transition:opacity .35s ease}
@keyframes sq{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes dr{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes ld{to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>
<div class="s">
<svg viewBox="0 0 128 128" class="mk"><defs><linearGradient id="g" x1="44" y1="64" x2="84" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8B7CFF"/><stop offset="1" stop-color="#4FD1FF"/></linearGradient></defs>
<rect class="sq" x=".75" y=".75" width="126.5" height="126.5" rx="28.3"/>
<path class="a a1" pathLength="1" d="M79.6 34.1A19 19 0 1 0 64 64"/>
<path class="a a2" pathLength="1" d="M64 64A19 19 0 1 1 48.4 93.9"/></svg>
<div class="w">SREON</div>
<div class="p"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#FFA136"/></svg>Powered by SPRFST Language</div>
</div><div class="bar"><i></i></div>
<script>window.fadeOut=function(){document.body.classList.add("out")}</script>
</body></html>
